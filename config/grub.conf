# SigmaOS GRUB Configuration
# Optimized GRUB settings for SigmaOS

GRUB_DEFAULT=0
GRUB_TIMEOUT=5
GRUB_DISTRIBUTOR="SigmaOS"
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"
GRUB_CMDLINE_LINUX=""

# Enable GRUB recovery menu
GRUB_DISABLE_SUBMENU=y

# Enable OS prober for detecting other OS
GRUB_DISABLE_OS_PROBER=false

# Use graphical terminal
GRUB_TERMINAL_OUTPUT=console

# Set resolution
GRUB_GFXMODE=auto
GRUB_GFXPAYLOAD_LINUX=keep

# Enable better font support
GRUB_FONT=/usr/share/grub/unicode.pf2

# Color scheme
GRUB_COLOR_NORMAL="white/black"
GRUB_COLOR_HIGHLIGHT="cyan/black"
