# SigmaOS KDE Plasma Configuration
# Optimized settings for KDE Plasma desktop

# Enable Compositing
[Compositing]
Enabled=true
Backend=OpenGL

# Performance Settings
[Effect]
kwin4_effect_dialogparentopacity=90
kwin4_effect_blur=0
kwin4_effect_fadedesktop=0

# KWin Settings
[Windows]
BorderlessMaximizedWindows=true

# Power Management
[PowerManagement]
DimDisplayOnIdle=true
DimDisplayOnIdleTimeSecs=300
TurnOffDisplayOnIdle=true
TurnOffDisplayOnIdleTimeSecs=600

# Plasma Theme
[Theme]
name=Breeze

# Color Scheme
[General]
ColorScheme=BreezeDark

# Font Settings
[General]
font=Noto Sans,10,-1,5,50,0,0,0,0,0
menuFont=Noto Sans,10,-1,5,50,0,0,0,0,0
smallestReadableFont=Noto Sans,8

# Icon Theme
[Icons]
Theme=breeze-dark

# Cursor Theme
[General]
cursorTheme=breeze_cursors

# Startup
[General]
startupenabled=true
autostart=networkmanagement-applet
