# SigmaOS systemd-resolved configuration
# DNS resolver configuration

[Resolve]
# Use default DNS servers
DNS=1.1.1.1
DNS=1.0.0.1
DNS=8.8.8.8
DNS=8.8.4.4

# Fallback DNS
FallbackDNS=9.9.9.9
FallbackDNS=149.112.112.112

# Enable DNS over TLS
DNSOverTLS=yes

# Enable DNSSEC
DNSSEC=yes

# Enable EDNS0
EDNS0=yes

# Cache size
CacheSize=4096

# Negative cache
CacheSizeNegative=0

# Use systemd-resolved stub listener
StubListener=yes

# LLMNR
LLMNR=yes

# Multicast DNS
MulticastDNS=yes

# Read /etc/hosts
ReadEtcHosts=yes

# Resolve unicast single-label names
ResolveUnicastSingleLabel=no
