# SigmaOS systemd-boot configuration
# For UEFI systems

timeout 5
default 1

title SigmaOS
linux /vmlinuz-linux
initrd /intel-ucode.img
initrd /initramfs-linux.img
options root="UUID=ROOT_UUID" rw quiet splash loglevel=3 vt.global_cursor_default=0

title SigmaOS (Fallback)
linux /vmlinuz-linux
initrd /intel-ucode.img
initrd /initramfs-linux-fallback.img
options root="UUID=ROOT_UUID" rw

title SigmaOS (Recovery Mode)
linux /vmlinuz-linux
initrd /intel-ucode.img
initrd /initramfs-linux.img
options root="UUID=ROOT_UUID" rw single

title SigmaOS (Verbose)
linux /vmlinuz-linux
initrd /intel-ucode.img
initrd /initramfs-linux.img
options root="UUID=ROOT_UUID" rw

title SigmaOS (No KMS)
linux /vmlinuz-linux
initrd /intel-ucode.img
initrd /initramfs-linux.img
options root="UUID=ROOT_UUID" rw nomodeset

title SigmaOS (No Splash)
linux /vmlinuz-linux
initrd /intel-ucode.img
initrd /initramfs-linux.img
options root="UUID=ROOT_UUID" rw quiet loglevel=3

title System Firmware
efi /EFI/BOOT/BOOTX64.EFI
