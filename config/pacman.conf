# SigmaOS-specific pacman.conf
# Adds SigmaOS repository to standard Arch configuration

#
# /etc/pacman.conf
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[community]
Include = /etc/pacman.d/mirrorlist

# If you want to run 32 bit applications on your x86_64 system,
# enable the multilib repositories as required here.

[multilib]
Include = /etc/pacman.d/mirrorlist

# SigmaOS Repository
[sigmaos]
SigLevel = Optional
Server = file:///var/lib/sigmaos/repo/$repo/os/$arch
# Uncomment for remote repository:
# Server = https://github.com/AaryanSinghChauhan09/Sigma/releases/download/packages/$repo/os/$arch
