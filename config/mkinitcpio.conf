#!/bin/bash
# SigmaOS mkinitcpio configuration
# Initramfs hooks for SigmaOS

HOOKS="base udev autodetect modconf block filesystems keyboard fsck"
COMPRESSION="zstd"
MODULES=""

# Add hooks for different scenarios
if [ "$1" = "live" ]; then
    HOOKS="base udev autodetect modconf block filesystems keyboard keymap consolefont sd-vconsole sd-encrypt"
fi

if [ "$1" = "encrypted" ]; then
    HOOKS="base udev autodetect modconf block encrypt filesystems keyboard fsck"
fi

# Print configuration
echo "HOOKS=\"$HOOKS\""
echo "COMPRESSION=\"$COMPRESSION\""
echo "MODULES=\"$MODULES\""
