#!/bin/bash
# SigmaOS initramfs configuration
# Based on Arch Linux mkinitcpio.conf with SigmaOS-specific optimizations

MODULES=(loop squashfs ext4 vfat btrfs xfs)
BINARIES=()
FILES=()
HOOKS=(base udev autodetect modconf block filesystems keyboard keymap consolefont plymouth resume fsck)

# Compression
COMPRESSION="zstd"

# COMPRESSION_OPTIONS
COMPRESSION_OPTIONS=(-9)

# COMPRESSION_PROGS
COMPRESSION_PROGS=(zstd xz gzip bzip2 lz4 lzma)

# COMPRESSION_FINDOPTS
COMPRESSION_FINDOPTS=(-regextype posix-regex -regex ".*\.(cpio|gz|bz2|xz|lz4|lzma|zst)$")

# MODULES_DEPS
MODULES_DEPS=(dm_mod dm_crypt)

# BINARIES_DEPS
BINARIES_DEPS=()

# FILES_DEPS
FILES_DEPS=()

# Early CPIO
EARLY_CPIO=

# PRESET_NAME
PRESET_NAME="default"

# ALL_kver
ALL_kver="/boot/vmlinuz-linux"

# ALL_config
ALL_config="/etc/mkinitcpio.conf"

# ALL_microcode
ALL_microcode=(/boot/intel-ucode.img /boot/amd-ucode.img)

# ALL_image
ALL_image="/boot/initramfs-linux.img"

# ALL_options
ALL_options=()

# PRESETS
PRESETS=('default')

# preset default
preset_name="default"
preset_kver="/boot/vmlinuz-linux"
preset_config="/etc/mkinitcpio.conf"
preset_image="/boot/initramfs-linux.img"
preset_options=()
