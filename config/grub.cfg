# SigmaOS GRUB Configuration
# Optimized for SigmaOS distribution

GRUB_DEFAULT=0
GRUB_TIMEOUT=5
GRUB_DISTRIBUTOR="SigmaOS"
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3 vt.global_cursor_default=0"
GRUB_CMDLINE_LINUX=""

# Preload both GPT and MBR modules
GRUB_PRELOAD_MODULES="part_gpt part_msdos"

# For booting DOS/Windows
GRUB_DISABLE_OS_PROBER=false

# Enable generic kernel
GRUB_DISABLE_LINUX_UUID=false

# Enable memory detection
GRUB_GFXMODE=auto
GRUB_GFXPAYLOAD_LINUX=keep

# Enable submenus
GRUB_DISABLE_SUBMENU=y

# Enable recovery entries
GRUB_DISABLE_RECOVERY=false

# Enable os-prober
GRUB_OS_PROBER_SKIP_LIST=""

# Terminal settings
GRUB_TERMINAL_INPUT="console"
GRUB_TERMINAL_OUTPUT="console"

# Boot arguments
GRUB_ENABLE_CRYPTODISK=y
GRUB_ENABLE_LINUX_UUID=true
GRUB_DISABLE_LINUX_PARTUUID=true

# Save boot entries
GRUB_SAVEDEFAULT=true

# Timeout style
GRUB_TIMEOUT_STYLE=menu

# Color scheme
GRUB_COLOR_NORMAL="light-gray/black"
GRUB_COLOR_HIGHLIGHT="green/black"
GRUB_COLOR_MENU_HIGHLIGHT="white/green"

# Font
GRUB_FONT="/usr/share/grub/unicode.pf2"

# Theme (optional)
# GRUB_THEME="/boot/grub/themes/sigmaos/theme.txt"

# Background image (optional)
# GRUB_BACKGROUND="/boot/grub/sigmaos.png"
