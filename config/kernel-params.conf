# SigmaOS kernel command line parameters
# Optimized for performance and compatibility

# Disable old compatibility options
vga=current
nomodeset

# Kernel parameters for better performance
intel_iommu=on
amd_iommu=on
iommu=pt

# Virtualization support
kvm_intel.nested=1
kvm_amd.nested=1

# Power management
pcie_aspm=off
pcie_port_pm=off

# Network performance
net.core.default_qdisc=fq
net.ipv4.tcp_fastopen=3
net.ipv4.tcp_congestion_control=bbr

# Filesystem performance
rootflags=commit=60,data=writeback

# Video
video=efifb:off
nvidia-drm.modeset=1
amdgpu.dc=1

# Audio
snd_hda_intel.dmic_detect=0

# USB
usbcore.autosuspend=-1

# Bluetooth
btusb.enable_autosuspend=0

# RAID/Storage
raid=noautodetect
md_mod.start_dirty_degraded=1

# Security
 lockdown=confidentiality
 mce=off
 mitigations=off

# Boot options
 quiet
 splash
 loglevel=3
 vt.global_cursor_default=0
 resume=UUID=
 resume_offset=
