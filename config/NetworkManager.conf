# SigmaOS NetworkManager configuration
# Optimized for SigmaOS distribution

[main]
# Enable strict firewall
rc-manager=resolvconf

# Use internal DHCP client
dhcp=internal

# DNS configuration
dns=none

# Don't use VPN's DNS
rc-manager=unmanaged

# Connection plugins
plugins=ifcfg-rh,ibft,team,keyfile

# Don't abort on failure
no-auto-default=*

[logging]
# Log level
audit=false
level=INFO
domains=ALL:INFO,SYSTEMD:DEBUG

[connection]
# Connection settings
ipv6.ip6-privacy=1

[device]
# Device settings
wifi.scan-rand-mac-address=yes
wifi.backend=iwd

[ifupdown]
# Ifupdown compatibility
managed=false
